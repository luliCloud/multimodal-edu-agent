[project]
name = "multimodal-edu-agent"
version = "0.1.0"
description = "Single-GPU prototype for a multimodal educational content pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.120.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.28.1",
  "anyio>=4.7.0",
]
worker = [
  "celery>=5.4.0",
  "redis>=5.0.0",
]
cuda = [
  "torch>=2.5.0",
  "imageio-ffmpeg>=0.6.0",
]
wan = [
  "torch>=2.5.0",
  "diffusers>=0.35.0,<0.38.0",
  "transformers>=4.49.0,<5.0.0",
  "accelerate>=1.1.0",
  "ftfy>=6.0.0",
  "sentencepiece>=0.2.0",
  "imageio>=2.35.0",
  "imageio-ffmpeg>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
